{% extends "base.html" %}

{% block title %}Profile — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="profile-container">

        <div class="profile-header">
            <h1 class="auth-title">{{ user['name'] }}</h1>
            <p class="auth-subtitle">{{ user['email'] }}</p>
            <p class="profile-since">Member since {{ member_since }}</p>
        </div>

        <div class="auth-card">
            <div class="profile-stats">
                <div class="stat-tile">
                    <span class="stat-label">Expenses logged</span>
                    <span class="stat-value">{{ stats['expense_count'] }}</span>
                </div>
                <div class="stat-tile">
                    <span class="stat-label">Total spent</span>
                    <span class="stat-value">${{ "%.2f"|format(stats['total_spent']) }}</span>
                </div>
            </div>

            <a href="{{ url_for('logout') }}" class="btn-ghost profile-logout">Log out</a>
        </div>

    </div>
</section>

{% endblock %}
